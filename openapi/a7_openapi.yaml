openapi: 3.0.0

info:
  version: '1.0'
  title: 'LBAW Lend-A-Hand Web API'
  description: 'Web Resources Specification (A7) for Lend-A-Hand'

servers:
  - url: http://lbaw2414.fe.up.pt
    description: Production server

externalDocs:
  description: 'Find more info here.'
  url: 'https://gitlab.up.pt/lbaw/lbaw2425/lbaw2414/-/wikis/eap.md'

tags:
  - name: 'M01: Authentication'
  - name: 'M02: Individual Profile'
  - name: 'M03: Notifications'
  - name: 'M04: Event'
  - name: 'M05: Comments'
  - name: 'M06: User Administration'
  - name: 'M07: Static pages'
  - name: 'M08: Search'

paths:

### M01: Authentication

  /login:
    get:
      operationId: R101
      summary: 'R101: Login Form'
      description: 'Display login form. Access: PUB'
      tags:
        - 'M01: Authentication'
      responses:
        '200':
          description: 'Ok. Show login UI'
    post:
      operationId: R102
      summary: 'R102: Login Action'
      description: 'Processes the login form submission and authenticate user. Access: PUB'
      tags:
        - 'M01: Authentication'

      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required: [email, password]

      responses:
        '302':
          description: 'Redirect after processing the login credentials.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Login was successful. Redirect to home page.'
                  value: '/home'
                302Error:
                  description: 'Login failed. Redirect back to login form'
                  value: '/login'
        '400':
          description: 'Bad Request. Malformed data or validation error.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /logout:

    post:
      operationId: R103
      summary: 'R103: Logout Action'
      description: 'Logout the current authenticated user. Access: USR, ADM'
      tags:
        - 'M01: Authentication'
      responses:
        '302':
          description: 'Redirect after processing logout.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Logout was successful. Redirect to login page'
                  value: '/login'

  /register:
    get:
      operationId: R104
      summary: 'R104: Register Form'
      description: 'Provide new user registration form. Access: VST'
      tags:
        - 'M01: Authentication'
      responses:
        '200':
          description: 'Ok. Show Sign-Up UI'

    post:
      operationId: R105
      summary: 'R105: Register Action'
      description: 'Processes the new user registration form submission. Access: VST'
      tags:
        - 'M01: Authentication'

      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string   
                  format: password
                confirm_password:
                  type: string    
                  format: password
                picture:
                  type: string
                  format: binary
              required: [name, username, email, password, confirm_password]

      responses:
        '302':
          description: 'Redirect after processing the new user information.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Registration was successful. Redirect to user profile.'
                  value: '/user/{id}'
                302Failure:
                  description: 'Registration failed. Redirect back to the registration form.'
                  value: '/register'
        '400':
          description: 'Bad Request. Malformed data or validation error.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /password/reset:
    post:
      operationId: R107
      summary: 'R107: Reset User Password'
      description: 'Resets the user password after receiving a valid token.'
      tags:
        - 'M01: Authentication'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
                verify_password:
                  type: string
                  format: password
              required:
                - token
                - password
                - verify_password
      responses:
        '200':
          description: 'Password reset successfully.'
        '400':
          description: 'Bad Request. Invalid or missing data.'
        '404':
          description: 'Invalid or expired reset token.'
        '500':
          description: 'Internal Server Error. An unexpected error occurred.'


### M02: Individual Profile

  /user/{username}:
    get:
      operationId: R201
      summary: 'R201: View Profile'
      description: 'Show the individual user profile. Access: USR, VST, ADM'
      tags:
        - 'M02: Individual Profile'

      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string

      responses:
        '200':
          description: 'OK. Show the profile of the user.'
        '302':
           description: 'User does not exist or is not logged in.'
           headers:
             Location:
               schema:
                 type: string
               example:
                 302Failure:
                   description: 'Failed. No user of given username found.'
                   value: '/'
        '403':
          description: 'You do not have permission to view this profile.'
        '404':
          description: 'User not found.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /user/{username}/edit:
    get:
      operationId: R202
      summary: 'R202: Edit Profile Form'
      description: 'Provide edit profile form. Access: USR, ADM'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        
      responses:
        '200':
          description: 'OK. Show Edit Profile UI.'
        '403':
          description: 'Forbidden. The user is not logged in.'
          headers:
            Location:
              schema:
               type: string
              examples:
                401Success:
                  description: 'Redirect back to home page UI.'
                  value: '/'
    post:
      operationId: R203
      summary: 'R203: Edit Profile Action'
      description: 'Processes the edit profile form submission. Access: USR, ADM'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:          
                  type: string
                username:
                  type: string
                picture:
                  type: string
                  format: binary
                email:
                  type: string
                  format: email
                password:    
                  type: string
                  format: password
              required: [name, username, picture, email, password]

      responses:
        '302':
          description: 'Redirect after editing profile.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Changes were successful. Redirect to User UI.'
                  value: '/user/{username}'
                302Error:
                  description: 'Failed, redirect to edit profile UI.'
                  value: '/user/{username}/edit'
        '400':
          description: 'Bad request. Invalid or missing fields.'
        '403':
          description: 'Forbidden. User cannot edit this profile.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /user/{username}/delete:
    post:
      operationId: R204
      summary: 'R204: Delete User Account'
      description: 'Delete a user account. Access: USR'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
              required: [string]
      responses:
        '302':
          description: 'Redirect after deleting user account.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Account was successfully deleted. Redirect to home page UI.'
                  value: '/home'
        '403':
          description: 'Forbidden. User does not have access.'
        '404':
          description: 'Not Found. User account not found.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /unblock-request:
    get:
      operationId: 'R205'
      summary: 'R207: Get Unblock Request Form.'
      description: 'Fetches the form for submitting an unblock request.'
      tags:
        - 'M02: Individual Profile'
        - 'M04: Event'
      responses:
        '200':
          description: 'Unblock request form fetched successfully.'
        '500':
          description: 'Internal server error.'

  /admin/unblock-requests:
    get:
      operationId: 'R207'
      summary: 'R207: Get Admin Unblock Requests.'
      description: 'Allows admin to view all unblock requests.'
      tags:
        - 'M06: User Administration'
      responses:
        '200':
          description: 'Successfully retrieved unblock requests.'
        '500':
          description: 'Internal server error.'
    
### M03: Notifications

  /notifications:
    get:
      operationId: R301
      summary: 'R301: Get Notifications'
      description: 'Retrieve a list of all notifications for the user. Access: USR'
      tags:
        - 'M03: Notifications'
      responses:
        '200':
          description: 'List of notifications retrieved successfully.'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    message:
                      type: string
                    read:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
        '403':
          description: 'Forbidden. User not authorized.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /notifications/dismiss:
    post:
      operationId: R302
      summary: 'R302: Dismiss Notification'
      description: 'Dismiss a specific notification by its ID. Access: USR'
      tags:
        - 'M03: Notifications'
      responses:
        '200':
          description: 'Notification dismissed successfully.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  notification_id:
                    type: integer
        '404':
          description: 'Notification not found.'
        '403':
          description: 'Forbidden. User not authorized.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /notifications/dismiss-all:
    post:
      operationId: R303
      summary: 'R303: Dismiss All Notifications'
      description: 'Dismiss all notifications for the user. Access: USR'
      tags:
        - 'M03: Notifications'
      responses:
        '200':
          description: 'All notifications dismissed successfully.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: 'Forbidden. User not authorized.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /notifications/count:
    get:
      operationId: R304
      summary: 'R304: Count Unread Notifications'
      description: 'Retrieve the count of unread notifications for the user. Access: USR'
      tags:
        - 'M03: Notifications'
      responses:
        '200':
          description: 'Unread notifications count retrieved successfully.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer
        '403':
          description: 'Forbidden. User not authorized.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'
    
### M04: Event

  /events:
    get:
      operationId: 'R401'
      summary: 'R401: List events created.'
      description: 'List all events created by the user. Access: VST, USR, ADM'
      tags:
        - 'M04: Event'
      responses:
        '200':
          description: A list of events created by user.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    date:
                      type: string
                      format: date-time
    post:
      operationId: 'R402'
      summary: 'R402: Create Event.'
      description: 'Create Event. Access: USR'
      tags:
        - 'M04: Event'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                date:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Event created successfully
        '400':
          description: Invalid input

  /events/{id}:
    delete:
      operationId: 'R403'
      summary: 'R403: Delete Event.'
      description: 'Delete Event. Access: CRT, ADM'
      tags:
        - 'M04: Event'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event to delete
      responses:
        '204':
          description: Event deleted successfully
        '404':
          description: Event not found
    get:
      operationId: 'R404'
      summary: 'R404: Details of Event.'
      description: 'Displays the page of the event with its details. Access: VST, USR'
      tags:
        - 'M04: Event'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  date:
                    type: string
                    format: date-time
        '404':
          description: Event not found
  
  /events/{event}:
    put:
      operationId: 'R405'
      summary: 'R405: Update Event.'
      description: 'Update Event. Access: CRT'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                date:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Event updated successfully
        '400':
          description: Invalid input
        '404':
          description: Event not found

  /events/{event}/polls:
    post:
      operationId: 'R406'
      summary: 'R406: Create Poll for Event.'
      description: 'Create Poll for Event. Access: PCT'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      responses:
        '201':
          description: Poll created successfully
        '400':
          description: Invalid input

  /events/{event}/request:
    post:
      operationId: 'R407'
      summary: 'R407: Request to Join an Event.'
      description: 'Request to Join an Event. Access: USR'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      responses:
        '200':
          description: Request to join sent successfully
        '400':
          description: Invalid input

  /events/{event}/join:
    post:
      operationId: 'R408'
      summary: 'R408: Join an Event.'
      description: 'Join an Event. Access: USR'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      responses:
        '200':
          description: Successfully joined the event
        '400':
          description: Invalid input

  /events/{event}/leave:
    post:
      operationId: 'R409'
      summary: 'R409: Leave an event.'
      description: 'Leave an event. Access: PCT'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      responses:
        '200':
          description: Successfully left the event
        '400':
          description: Invalid input

  /events/{event}/participators/{user}/kick:
    post:
      operationId: 'R410'
      summary: 'R410: Kick a Participant from Event.'
      description: 'Kick a Participant from Event. Access: CRT, ADM'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
        - name: user
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the user to be kicked
      responses:
        '200':
          description: Successfully kicked the participant
        '404':
          description: Participant or event not found    

  /events/category={id}:
    get:
      operationId: 'R411'
      summary: 'R411: Events by Category.'
      description: 'Events by Category. Access: VST, USR, ADM'
      tags:
        - 'M04: Event'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the category
      responses:
        '200':
          description: A list of events in the specified category
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    date:
                      type: string
                      format: date-time

  /event/create:
    get:
      operationId: 'R412'
      summary: 'R412: Event Create Form.'
      description: 'Event Create Form. Access: USR'
      tags:
        - 'M04: Event'
      responses:
        '200':
          description: Event create form
        '400':
          description: Invalid input

  /events/{event}/edit:
    get:
      operationId: 'R413'
      summary: 'R413: Event Edit Form.'
      description: 'Event Edit Form. Access: CRT'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      responses:
        '200':
          description: Event edit form
        '404':
          description: Event not found    

  /events/{event}/survey:
    get:
      operationId: 'R414'
      summary: 'R414: Get survey details for the event.'
      description: 'Get survey details for the event. Access: CRT'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      responses:
        '200':
          description: Survey details for the event
        '404':
          description: Event not found
    post:
      operationId: 'R415'
      summary: 'R415: Submit a survey response for an event.'
      description: 'Submit a survey response for an event. Access: PTC'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                responses:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Survey submitted successfully
        '400':
          description: Invalid input

  /events/{event}/survey/stats:
    get:
      operationId: 'R416'
      summary: 'R416: Get survey statistics for the event.'
      description: 'Get survey statistics for the event. Access: CRT'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      responses:
        '200':
          description: Survey statistics for the event
        '404':
          description: Event not found
  
  /events/{event}/update-comment-form:
    get:
      operationId: 'R417'
      summary: 'R417: Get Update Comment Form.'
      description: 'Fetches the update comment form for a specific event.'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the event.'
      responses:
        '200':
          description: 'Successfully fetched the update comment form.'
        '404':
          description: 'Event not found.'

  /polls/{poll}/vote:
    post:
      operationId: 'R418'
      summary: 'R418: Submit Vote for a Poll.'
      description: 'Allows users to submit a vote for a specific poll.'
      tags:
        - 'M04: Event'
      parameters:
        - name: poll
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the poll.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vote_option:
                  type: string
                  description: 'The selected vote option.'
      responses:
        '200':
          description: 'Vote submitted successfully.'
        '400':
          description: 'Invalid vote submission.'

  /admin/unblock-requests/{id}/approve:
    post:
      operationId: 'R421'
      summary: 'R421: Approve Unblock Request.'
      description: 'Admin approves an unblock request.'
      tags:
        - 'M06: User Administration'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the unblock request.'
      responses:
        '200':
          description: 'Unblock request approved.'
        '404':
          description: 'Unblock request not found.'

  /admin/unblock-requests/{id}/reject:
    post:
      operationId: 'R422'
      summary: 'R422: Reject Unblock Request.'
      description: 'Admin rejects an unblock request.'
      tags:
        - 'M06: User Administration'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the unblock request.'
      responses:
        '200':
          description: 'Unblock request rejected.'
        '404':
          description: 'Unblock request not found.'

  /events/search:
    get:
      operationId: 'R423'
      summary: 'R423: Search for Events.'
      description: 'Allows users to search for events based on criteria.'
      tags:
        - 'M08: Search'
      responses:
        '200':
          description: 'Search results retrieved successfully.'
        '400':
          description: 'Invalid search query.'
  
  /events/{event}/event-actions:
    get:
      operationId: 'R424'
      summary: 'R424: Get Event Actions.'
      description: 'Fetches available actions for a specific event.'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the event.'
      responses:
        '200':
          description: 'Successfully fetched event actions.'
        '404':
          description: 'Event not found.'

  /events/{event}/participants:
    get:
      operationId: 'R425'
      summary: 'R425: Get Event Participants.'
      description: 'Fetches participants of a specific event.'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the event.'
      responses:
        '200':
          description: 'Successfully retrieved participants.'
        '404':
          description: 'Event not found.'

### M05: Comments

  /comments/{comment}/delete:
    post:
      operationId: R501
      summary: 'R501: Delete a comment'
      description: 'Deletes a specific comment from the system. Access: VST, USR, ADM'
      tags:
        - 'M05: Comments'
      parameters:
        - name: comment
          in: path
          description: 'ID of the comment to delete'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: integer
              required: [id]
      responses:
        '302':
          description: 'Redirect after deleting comment.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Comment was successfully deleted. Redirect to Home page.'
                  value: '/'
        '403':
          description: 'Forbidden. User does not have access.'
        '404':
          description: 'Not Found. Comment not found.'
        '500':
          description: 'Internal Server Error. Unexpected issue occurred.'

  /comments/{commentId}/photos:
    get:
      operationId: R502
      summary: 'R502: Get photos for a comment'
      description: 'Fetches all photos associated with a specific comment.'
      tags:
        - 'M05: Comments'
      parameters:
        - name: commentId
          in: path
          description: 'ID of the comment to retrieve photos for'
          required: true
          schema:
            type: string
      responses:
        '200':

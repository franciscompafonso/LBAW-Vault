openapi: 3.0.0

info:
  version: '1.1'
  title: 'LBAW Lend-A-Hand Web API'
  description: 'Web Resources Specification (A7) for Lend-A-Hand'

servers:
  - url: http://lbaw2414.fe.up.pt
    description: Production server

externalDocs:
  description: 'Find more info here.'
  url: 'https://gitlab.up.pt/lbaw/lbaw2425/lbaw2414/-/wikis/eap.md'

tags:
  - name: 'M01: Authentication'
  - name: 'M02: Individual Profile'
  - name: 'M03: Notifications'
  - name: 'M04: Event'
  - name: 'M05: Comments'
  - name: 'M05: Comments'
  - name: 'M06: User Administration'
  - name: 'M07: Static pages'
  - name: 'M08: Search'

paths:

### M01: Authentication

  /login:
    get:
      operationId: R101
      summary: 'R101: Login Form'
      description: 'Display login form. Access: PUB'
      tags:
        - 'M01: Authentication'
      responses:
        '200':
          description: 'Ok. Show login UI'
    post:
      operationId: R102
      summary: 'R102: Login Action'
      description: 'Processes the login form submission and authenticate user. Access: PUB'
      tags:
        - 'M01: Authentication'

      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required: [email, password]

      responses:
        '302':
          description: 'Redirect after processing the login credentials.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Login was successful. Redirect to home page.'
                  value: '/home'
                302Error:
                  description: 'Login failed. Redirect back to login form'
                  value: '/login'
        '400':
          description: 'Bad Request. Malformed data or validation error.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /logout:
    post:
      operationId: R103
      summary: 'R103: Logout Action'
      description: 'Logout the current authenticated user. Access: USR, ADM'
      tags:
        - 'M01: Authentication'
      responses:
        '302':
          description: 'Redirect after processing logout.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Logout was successful. Redirect to login page'
                  value: '/login'

  /register:
    get:
      operationId: R104
      summary: 'R104: Register Form'
      description: 'Provide new user registration form. Access: VST'
      tags:
        - 'M01: Authentication'
      responses:
        '200':
          description: 'Ok. Show Sign-Up UI'

    post:
      operationId: R105
      summary: 'R105: Register Action'
      description: 'Processes the new user registration form submission. Access: VST'
      tags:
        - 'M01: Authentication'

      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string   
                  format: password
                confirm_password:
                  type: string    
                  format: password
                picture:
                  type: string
                  format: binary
              required: [name, username, email, password, confirm_password]

      responses:
        '302':
          description: 'Redirect after processing the new user information.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Registration was successful. Redirect to user profile.'
                  value: '/user/{username}'
                302Failure:
                  description: 'Registration failed. Redirect back to the registration form.'
                  value: '/register'
        '400':
          description: 'Bad Request. Malformed data or validation error.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /password/reset:
     get:
      operationId: R106
      summary: 'R106: Get Password Reset Form'
      description: 'Fetches the form for requesting a password reset link. Access: USR'
      tags:
        - 'M01: Authentication'
      responses:
        '200':
          description: 'Password reset form fetched successfully.'
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'An unexpected error occurred while fetching the password reset form.'
                  success:
                    type: boolean
                    example: false
    post:
      operationId: R107
      summary: 'R107: Reset User Password'
      description: 'Resets the user password after receiving a valid token. Access: USR' 
      tags:
        - 'M01: Authentication'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
                verify_password:
                  type: string
                  format: password
              required:
                - token
                - password
                - verify_password
      responses:
        '200':
          description: 'Password reset successfully.'
        '400':
          description: 'Bad Request. Invalid or missing data.'
        '404':
          description: 'Invalid or expired reset token.'
        '500':
          description: 'Internal Server Error. An unexpected error occurred.'
  
  /password/reset/{token}:
    get:
      operationId: R108
      summary: 'R108: Get Password Reset Token Form'
      description: 'Fetches the form to reset the password using a token. Access: USR'
      tags:
        - 'M01: Authentication'
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: 'The password reset token.'
      responses:
        '200':
          description: 'Password reset token form fetched successfully.'
        '404':
          description: 'Invalid or expired token.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'The password reset token is invalid or has expired.'
                  success:
                    type: boolean
                    example: false
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'An unexpected error occurred while fetching the password reset token form.'
                  success:
                    type: boolean
                    example: false
  /auth/google:
    get:
      operationId: R109
      summary: 'R109: Google Authentication Redirect'
      description: 'Redirects the user to the Google authentication page. Access: PUB'
      tags:
        - 'M01: Authentication'
      responses:
        '302':
          description: 'Redirected to Google authentication.'
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'An unexpected error occurred while redirecting to Google authentication.'
                  success:
                    type: boolean
                    example: false
  
  /auth/google/call-back:
    get:
      operationId: R110
      summary: 'R110: Google Authentication Callback'
      description: 'Handles the callback after Google authentication. Access: PUB'
      tags:
        - 'M01: Authentication'
      responses:
        '200':
          description: 'Authentication successful.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Authentication successful.'
                  success:
                    type: boolean
                    example: true
        '400':
          description: 'Authentication failed due to invalid callback data.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid callback data.'
                  success:
                    type: boolean
                    example: false
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'An unexpected error occurred during the authentication callback.'
                  success:
                    type: boolean
                    example: false

### M02: Individual Profile

  /user/{username}:
    get:
      operationId: R201
      summary: 'R201: View Profile'
      description: 'Show the individual user profile. Access: USR, ADM'
      tags:
        - 'M02: Individual Profile'

      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string

      responses:
        '200':
          description: 'OK. Show the profile of the user.'
        '302':
           description: 'User does not exist or is not logged in.'
           headers:
             Location:
               schema:
                 type: string
               example:
                 302Failure:
                   description: 'Failed. No user of given username found.'
                   value: '/'
        '403':
          description: 'You do not have permission to view this profile.'
        '404':
          description: 'User not found.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /user/{username}/edit:
    get:
      operationId: R202
      summary: 'R202: Edit Profile Form'
      description: 'Provide edit profile form. Access: USR, ADM'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        
      responses:
        '200':
          description: 'OK. Show Edit Profile UI.'
        '403':
          description: 'Forbidden. The user is not logged in.'
          headers:
            Location:
              schema:
               type: string
              examples:
                401Success:
                  description: 'Redirect back to home page UI.'
                  value: '/'
    post:
      operationId: R203
      summary: 'R203: Edit Profile Action'
      description: 'Processes the edit profile form submission. Access: USR, ADM'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:          
                  type: string
                username:
                  type: string
                picture:
                  type: string
                  format: binary
                email:
                  type: string
                  format: email
                password:    
                  type: string
                  format: password
              required: [name, username, picture, email, password]

      responses:
        '302':
          description: 'Redirect after editing profile.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Changes were successful. Redirect to User UI.'
                  value: '/user/{username}'
                302Error:
                  description: 'Failed, redirect to edit profile UI.'
                  value: '/user/{username}/edit'
        '400':
          description: 'Bad request. Invalid or missing fields.'
        '403':
          description: 'Forbidden. User cannot edit this profile.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /user/{username}/delete:
    post:
      operationId: R204
      summary: 'R204: Delete User Account'
      description: 'Delete a user account. Access: USR'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
              required: [string]
      responses:
        '302':
          description: 'Redirect after deleting user account.'
          headers:
            Location:
              schema:
                type: string
              examples:
                302Success:
                  description: 'Account was successfully deleted. Redirect to home page UI.'
                  value: '/home'
        '403':
          description: 'Forbidden. User does not have access.'
        '404':
          description: 'Not Found. User account not found.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /unblock-request:
    get:
      operationId: R205
      summary: 'R205: Get Unblock Request Form.'
      description: 'Fetches the form for submitting an unblock request. Access: USR'
      tags:
        - 'M02: Individual Profile'
      responses:
        '200':
          description: 'Unblock request form fetched successfully.'
        '500':
          description: 'Internal server error.'
    post:
      operationId: 'R206'
      summary: 'R206: Submit Unblock Request'
      description: 'Allows a user to submit an unblock request. Access: USR'
      tags:
        - 'M02: Individual Profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 'The reason for requesting the unblock.'
                  minLength: 1
                  maxLength: 500
        description: 'The data for the unblock request.'
      responses:
        '200':
          description: 'Unblock request submitted successfully.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Unblock request submitted successfully.'
                  success:
                    type: boolean
                    example: true
        '400':
          description: 'Invalid unblock request data.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Reason is required and must be valid.'
                  success:
                    type: boolean
                    example: false
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'An unexpected error occurred while processing the unblock request.'
                  success:
                    type: boolean
                    example: false

  /user/{username}/invites:
    get:
      operationId: R207
      summary: 'R207: Get User Invites'
      description: 'Retrieve a list of invites for a specific user by their username. Access: USR'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          description: 'The username of the user whose invites are being fetched.'
      responses:
        '200':
          description: 'List of invites retrieved successfully.'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    sender:
                      type: string
                      description: 'The username of the sender.'
                    event_name:
                      type: string
                      description: 'The name of the event for which the invite was sent.'
                    description:
                      type: string
                      description: 'Optional description provided with the invite.'
                    date:
                      type: string
                      format: date-time
                      description: 'The date the invite was sent.'
        '404':
          description: 'User not found.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User not found.'
                  success:
                    type: boolean
                    example: false

  /invites/{invitesId}/decline:
    post:
      operationId: R208
      summary: 'R208: Decline Invite'
      description: 'Declines an invite for a specific user. Access: USR'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - name: invitesId
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the invite'
      responses:
        '200':
          description: 'Invite declined successfully.'
        '400':
          description: 'Invalid invite data.'
        '404':
          description: 'Invite not found.'

  /invites/{invitesId}/accept:
    post:
      operationId: R209
      summary: 'R209: Accept Invite'
      description: 'Accepts an invite for a specific user. Access: USR'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - name: invitesId
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the invite'
      responses:
        '200':
          description: 'Invite accepted successfully.'
        '400':
          description: 'Invalid invite data.'
        '404':
          description: 'Invite not found.'
  
  /invite/{id}:
    delete:
      operationId: R210
      summary: 'R210: Delete Invite'
      description: 'Delete a specific invite by its ID. Access: USR'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the invite to delete.'
      responses:
        '200':
          description: 'Invite deleted successfully.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invite deleted successfully.'
                  success:
                    type: boolean
                    example: true
        '403':
          description: 'Forbidden. User does not have permission to delete this invite.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'You do not have permission to delete this invite.'
                  success:
                    type: boolean
                    example: false
        '404':
          description: 'Invite not found.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invite not found.'
                  success:
                    type: boolean
                    example: false

  /requests/{requestId}/accept:
    post:
      operationId: R211
      summary: 'R211: Accept Join Request'
      description: 'Accepts a join request for an event. Access: USR'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the join request'
      responses:
        '200':
          description: 'Join request accepted successfully.'
        '400':
          description: 'Invalid request data.'
        '404':
          description: 'Join request not found.'\

  /requests/{requestId}/decline:
    post:
      operationId: R212
      summary: 'R212: Decline Join Request'
      description: 'Declines a join request for an event. Access: USR'
      tags:
        - 'M02: Individual Profile'
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the join request'
      responses:
        '200':
          description: 'Join request declined successfully.'
        '400':
          description: 'Invalid request data.'
        '404':
          description: 'Join request not found.'

### M03: Notifications

  /api/notifications:
    get:
      operationId: R301
      summary: 'R301: Get Notifications via API'
      description: 'Retrieve a list of all notifications for the user. Access: USR'
      tags:
        - 'M03: Notifications'
      responses:
        '200':
          description: 'List of notifications retrieved successfully.'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    message:
                      type: string
                    read:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
        '403':
          description: 'Forbidden. User not authorized.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /notifications/{id}/dismiss:
    post:
      operationId: R302
      summary: 'R302: Dismiss Notification'
      description: 'Dismiss a specific notification by its ID. Access: USR'
      tags:
        - 'M03: Notifications'
      responses:
        '200':
          description: 'Notification dismissed successfully.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  notification_id:
                    type: integer
        '404':
          description: 'Notification not found.'
        '403':
          description: 'Forbidden. User not authorized.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

  /notifications/dismiss-all:
    post:
      operationId: R303
      summary: 'R303: Dismiss All Notifications'
      description: 'Dismiss all notifications for the user. Access: USR'
      tags:
        - 'M03: Notifications'
      responses:
        '200':
          description: 'All notifications dismissed successfully.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: 'Forbidden. User not authorized.'
        '500':
          description: 'Internal Server Error. An unexpected issue occurred.'

### M04: Event

  /events:
    get:
      operationId: R401
      summary: 'R401: List events created.'
      description: 'List all events created by the user. Access: USR'
      tags:
        - 'M04: Event'
      responses:
        '200':
          description: A list of events created by user.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    date:
                      type: string
                      format: date-time
    post:
      operationId: R402
      summary: 'R402: Create Event.'
      description: 'Create Event. Access: USR'
      tags:
        - 'M04: Event'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                date:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Event created successfully
        '400':
          description: Invalid input

  /events/{id}:
    get:
      operationId: R403
      summary: 'R403: Details of Event.'
      description: 'Displays the page of the event with its details. Access: VST, USR'
      tags:
        - 'M04: Event'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  date:
                    type: string
                    format: date-time
        '404':
          description: Event not found
    delete:
      operationId: R404
      summary: 'R404: Delete Event.'
      description: 'Delete Event. Access: CRT, ADM'
      tags:
        - 'M04: Event'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event to delete
      responses:
        '204':
          description: Event deleted successfully
        '404':
          description: Event not found
    
  /events/{id}/cancel:
    put:
      operationId: R405
      summary: 'R405: Cancel an Event'
      description: 'Allows an authorized user to cancel a specific event. Access: CRT'
      tags:
        - 'M04: Event'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the event to cancel.'
      responses:
        '200':
          description: 'Event cancelled successfully.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Event cancelled successfully.'
                  success:
                    type: boolean
                    example: true
        '403':
          description: 'Forbidden. User does not have access to cancel this event.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'You do not have permission to cancel this event.'
                  success:
                    type: boolean
                    example: false
        '404':
          description: 'Event not found.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Event not found.'
                  success:
                    type: boolean
                    example: false
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'An unexpected error occurred while cancelling the event.'
                  success:
                    type: boolean
                    example: false

  /events/{event}:
    put:
      operationId: R406
      summary: 'R406: Update Event.'
      description: 'Update Event. Access: CRT, ADM'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                date:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Event updated successfully
        '400':
          description: Invalid input
        '404':
          description: Event not found

  /events/{event}/polls:
    post:
      operationId: R407
      summary: 'R407: Create Poll for Event.'
      description: 'Create Poll for Event. Access: CRT'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      responses:
        '201':
          description: Poll created successfully
        '400':
          description: Invalid input

  /events/{event}/request:
    post:
      operationId: R408
      summary: 'R408: Request to Join an Event.'
      description: 'Request to Join an Event. Access: USR'
      tags:
        - 'M04: Event'
      parameters:
        - name: event
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the event
      responses:

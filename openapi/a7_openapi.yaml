  ### M06: Comments

  /comments:
    get:
      operationId: R601
      summary: 'R601: List all comments'
      description: 'List all available comments. Access: VST, USR, ADM'
      tags:
        - 'M06: Comments'
      parameters:
        - in: query
          name: query
          description: String to use for full-text search
          schema:
            type: string
          required: false
        - in: query
          name: event
          description: Event name
          schema:
            type: string
          required: false
        - in: query
          name: date
          description: Comments on a certain date
          schema:
            type: string
            format: date-time
          required: false
        - in: query
          name: commented_by
          description: Boolean with the commented_by flag value
          schema:
            type: boolean
          required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    text:
                      type: string
                    is_pinned:
                      type: boolean
                    score:
                      type: integer
                    edited:
                      type: boolean
                    date:
                      type: string
                      format: date-time
        '400':
          description: 'Bad request. Invalid or incomplete query parameters.'
        '403':
          description: 'Forbidden. User does not have the necessary permissions to access comments.'
        '500':
          description: 'Internal server error. Unable to process the request.'

  /comments/create:

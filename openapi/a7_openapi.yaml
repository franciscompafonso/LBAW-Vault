### M06: User Administration 
  
  /admin/logout:
    post:
      operationId: R601
      summary: 'R601: Admin logout'
      description: 'Logs out the admin from the system. Access: ADM'
      tags:
        - 'M06: User Administration'
      responses:
        '200':
          description: 'Successfully logged out.'
        '401':
          description: 'Unauthorized. Admin not logged in.'
        '500':
          description: 'Internal server error. Unable to log out.'

  /admin/user-management:
    get:
      operationId: R602
      summary: 'R602: List all users'
      description: 'Fetches a list of all users for management. Access: ADM'
      tags:
        - 'M06: User Administration'
      responses:
        '200':
          description: 'Successfully retrieved user list.'
        '500':
          description: 'Internal server error. Unable to retrieve users.'

  /admin/user-management/search-user:
    get:
      operationId: R603
      summary: 'R603: Search users'
      description: 'Allows searching for users by criteria. Access: ADM'
      tags:
        - 'M06: User Administration'
      responses:
        '200':
          description: 'Successfully fetched search results.'
        '500':
          description: 'Internal server error. Unable to perform search.'

  /admin/user-management/delete-user/{username}:
    delete:
      operationId: R604
      summary: 'R604: Delete a user'
      description: 'Deletes a user from the system. Access: ADM'
      tags:
        - 'M06: User Administration'
      parameters:
        - name: user
          in: path
          description: 'ID of the user to delete'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'User successfully deleted.'
        '404':
          description: 'User not found.'
        '500':
          description: 'Internal server error. Unable to delete user.'

  /admin/user-management/block-user/{username}:
    post:
      operationId: R605
      summary: 'R605: Block a user'
      description: 'Blocks a user from the platform. Access: ADM'
      tags:
        - 'M06: User Administration'
      parameters:
        - name: user
          in: path
          description: 'ID of the user to block'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'User successfully blocked.'
        '404':
          description: 'User not found.'
        '500':
          description: 'Internal server error. Unable to block user.'

  /admin/user-management/unblock-user/{username}:
    patch:
      operationId: R606
      summary: 'R606: Unblock a user'
      description: 'Unblocks a previously blocked user. Access: ADM'
      tags:
        - 'M06: User Administration'
      parameters:
        - name: user
          in: path
          description: 'ID of the user to unblock'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'User successfully unblocked.'
        '404':
          description: 'User not found.'
        '500':
          description: 'Internal server error. Unable to unblock user.'

  /admin/create:
    get:
      operationId: R607
      summary: 'R607: Show create admin form'
      description: 'Displays the form to create a new admin. Access: ADM'
      tags:
        - 'M06: User Administration'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:          
                  type: string
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:    
                  type: string
                  format: password
              required: [name, username, picture, email, password]
      responses:
        '200':
          description: 'OK. Admin created successfully.'
        '400':
          description: 'Bad Request. Invalid category data.'
        '403':
          description: 'Forbidden. User does not have permission.'

  /admin/store:
    post:
      operationId: R608
      summary: 'R608: Store a new admin'
      description: 'Stores the details of a new admin in the system. Access: ADM'
      tags:
        - 'M06: User Administration'
      responses:
        '200':
          description: 'Admin successfully created.'
        '400':
          description: 'Bad request. Validation failed.'
        '500':
          description: 'Internal server error. Unable to create admin.'

  /admin/unblock-requests:
  get:
    operationId: 'R609'
    summary: 'R609: Get Admin Unblock Requests.'
    description: 'Allows admin to view all unblock requests.'
    tags:
      - 'M06: User Administration'
    responses:
      '200':
        description: 'Successfully retrieved unblock requests.'
      '500':
        description: 'Internal server error.'

  /admin/unblock-requests/{id}/approve:
    post:
      operationId: 'R610'
      summary: 'R610: Approve Unblock Request.'
      description: 'Admin approves an unblock request.'
      tags:
        - 'M06: User Administration'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the unblock request.'
      responses:
        '200':
          description: 'Unblock request approved.'
        '404':
          description: 'Unblock request not found.'

  /admin/unblock-requests/{id}/reject:
    post:
      operationId: 'R611'
      summary: 'R611: Reject Unblock Request.'
      description: 'Admin rejects an unblock request.'
      tags:
        - 'M06: User Administration'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 'The ID of the unblock request.'
      responses:
        '200':
          description: 'Unblock request rejected.'
        '404':
          description: 'Unblock request not found.'

